<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Choose Your Plan</h1>
        
        <div class="pricing-container">
            <div class="card">
            <h2>Basic</h2>
            <p class="price">₹199</p>
            <p>per month</p>

            <h3>Features</h3>
            <ul>
                <li>HTML</li>
                <li>Basic CSS</li>
                <li>One Mini project</li>
            </ul>
            <button class="btn">Buy now</button>
        </div>
        <div class="card">
            <h2>Pro</h2>
            <p class="price">₹599</p>
            <p>per month</p>

            <h3>Features</h3>
            <ul>
                <li>Html</li>
                <li>CSS with all concepts</li>
                <li>3 mini projects</li>
            </ul>
            <button class="btn">Buy now</button>
        </div>
        <div class="card">
            <h2>Premium</h2>
            <p class="price">₹999</p>
            <p>per month</p>

            <h3>Features</h3>
            <ul>
                <li>Full Stack Web Development</li>
                <li>React Native</li>
                <li>Project: Task Tracker App</li> 
            </ul>
            <button class="btn">Buy now</button>
        </div>
        </div>
    </div>
</body>
</html>
